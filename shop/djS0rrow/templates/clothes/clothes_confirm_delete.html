{% extends 'base.html' %}

{% block title %}Удаление товара — Grailed{% endblock %}

{% block content %}
<div class="page-content">
    <h1>Удалить товар «{{ object.name }}»?</h1>
    <p>Это действие нельзя отменить.</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" style="padding:10px 14px;border:1px solid #b00020;background:#b00020;color:#fff;border-radius:6px;">
            Удалить
        </button>
        <a href="{% url 'product_detail' object.pk %}" style="margin-left:12px;">Отмена</a>
    </form>
</div>
{% endblock %}
