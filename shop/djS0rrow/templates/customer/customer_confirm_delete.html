{% extends 'base.html' %}

{% block title %}Удаление покупателя — Grailed{% endblock %}

{% block content %}
<div class="page-content">
    <h1>Удалить покупателя «{{ object.last_name }} {{ object.first_name }}»?</h1>
    <p>Если у покупателя есть заказы, удалить его не получится.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="padding:10px 14px;border:1px solid #b00020;background:#b00020;color:#fff;border-radius:6px;">
            Удалить
        </button>
        <a href="{% url 'customer_detail' object.pk %}" style="margin-left:12px;">Отмена</a>
    </form>
</div>
{% endblock %}
