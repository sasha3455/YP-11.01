services:
  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USERNAME_PGSQL}
      POSTGRES_PASSWORD: ${DB_PASSWORD_PGSQL}
      POSTGRES_DB: ${DB_NAME_PGSQL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shop_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME_PGSQL} -d ${DB_NAME_PGSQL}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Web/Dockerfile
    container_name: django_web
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      - ./shop/media:/app/media
    networks:
      - shop_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - static_volume:/app/staticfiles:ro
      - ./shop/media:/app/media:ro
    depends_on:
      - web
    networks:
      - shop_network

volumes:
  postgres_data:
  static_volume:

networks:
  shop_network:
    driver: bridge
